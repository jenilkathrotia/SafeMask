# SafeMask Configuration
# -----------------------------------------------------------------------
# Replace the paths below with your actual ACDC dataset location.
# The glob pattern  */train  matches all adverse-condition sub-folders
# (fog, night, rain, snow) in one go.
# -----------------------------------------------------------------------

dataset:
  # ACDC paths on this Mac. Trainer uses only train/val.
  train_image_dir: "/Users/jenilkathrotiya/Downloads/rgb_anon_trainvaltest/rgb_anon"
  val_image_dir:   "/Users/jenilkathrotiya/Downloads/rgb_anon_trainvaltest/rgb_anon"
  train_mask_dir:  "/Users/jenilkathrotiya/Downloads/CS 136/TermProject/SafeMask/gt_trainval/gt"
  val_mask_dir:    "/Users/jenilkathrotiya/Downloads/CS 136/TermProject/SafeMask/gt_trainval/gt"

  fog_image_dir: "data/fog/images"
  fog_mask_dir: "data/fog/masks"
  night_image_dir: "data/night/images"
  night_mask_dir: "data/night/masks"
  rain_image_dir: "data/rain/images"
  rain_mask_dir: "data/rain/masks"
  snow_image_dir: "data/snow/images"
  snow_mask_dir: "data/snow/masks"

  image_size: [128, 256]   # half-res for fast Mac MPS training
  num_classes: 19

training:
  batch_size: 8
  epochs: 5                # 5 epochs is enough for a demo-quality model
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  save_dir: "outputs/checkpoints"
  patience: 5

model:
  architecture: "DeepLabV3Plus"
  encoder: "resnet18"
  encoder_weights: "imagenet"

uncertainty:
  entropy_threshold: 0.5
  mc_dropout_passes: 10

# CS 136 preprocessing: applies our term-project findings to every
# training image. See cs136_preprocessing/Part3_Robustness/REPORT.md
# for why each setting is on by default.
cs136_preprocessing:
  enabled: true
  gaussian:
    enabled: true
    sigma: 1.0          # doubles Canny noise robustness (Part 3)
  clahe:
    enabled: true
    conditions: [fog, night]   # only applied to these splits
    clip_limit: 3.0
    tile_grid: 8
  canny_channel:
    enabled: true        # adds Canny edges as a 4th input channel
    theta_low_frac: 0.05
    theta_high_mult: 2.5
    morph_cleanup: true  # closing+opening on the edge map
